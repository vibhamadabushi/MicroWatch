groups:
  - name: microwatch-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          100 *
          sum by (job) (rate(http_server_request_duration_count{http_response_status_code=~"5.."}[1m]))
          /
          sum by (job) (rate(http_server_request_duration_count[1m]))
          > 5
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "5xx error rate has exceeded 5% for 15 seconds on service {{ $labels.job }}."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (
              rate(http_server_request_duration_bucket[1m])
            )
          ) > 0.5
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "p95 latency has exceeded 500ms for 15 seconds on service {{ $labels.job }}."

      - alert: ServiceDown
        expr: up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Service instance {{ $labels.job }} is down"
          description: "Prometheus cannot scrape endpoint {{ $labels.instance }} for service {{ $labels.job }}."

      - alert: InventoryServiceUnavailable
        expr: |
          sum by (job) (rate(inventory_requests_failed_total{reason="service_unavailable"}[1m])) > 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Inventory stock verification service unavailable"
          description: "Inventory stock verification requests are failing with HTTP 503 on service {{ $labels.job }}."

      - alert: HighInventoryStockRejections
        expr: |
          sum(rate(inventory_stock_rejections_total[1m])) > 0.2
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Elevated inventory stock rejections"
          description: "Multiple customer orders are failing due to insufficient product inventory."
